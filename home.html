<!doctype html>
<html>
  <head>
    <title>Til Maiken</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Til min syge og søde bøf</h1>

    <div>
      <p class="text">Hej bøf du er syg, øv😓</p>
      <p class="text">Heldigvis skal du nok blive rask igen!!</p>
      <p class="text">
        Skriv hvad dit yndlingsdyr er, så skal du få et rigtig fint billede
        her❤️
      </p>
    </div>
    <div class="searchbar">
      <input id="search" type="text" placeholder="Skriv dyr her..." />
      <button id="knap">Klik her!</button>
    </div>
    <div id="dyr"></div>
    <script src="script.js" defer></script>
  </body>
</html>
